# Serves the built SPA and proxies /api to medcode-api, so the browser talks to
# a single origin: no CORS, and one image works in every environment (the API
# base URL is the relative "/api", not a baked-in host).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded training PDFs pass through here; nginx's 1m default would 413
    # them. medcode-api streams them on to the RAG service.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # Literal upstream name: nginx resolves it once at startup, so compose
        # must start medcode-api first (depends_on) or nginx exits.
        proxy_pass http://medcode-api:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI suggestions and knowledge training run through the RAG service and
        # can take minutes (medcode-api itself allows 600s). The 60s default
        # here would 504 them mid-answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # SPA routing: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
