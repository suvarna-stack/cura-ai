<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMed mock console</title>
<style>
  /* ---- tokens ------------------------------------------------------- */
  :root {
    --bg: #f6f8f7;          /* cool mist */
    --panel: #ffffff;
    --ink: #17211e;          /* green-black */
    --muted: #5d6b66;
    --line: #e1e7e4;
    --line-soft: #ecf0ee;
    --accent: #0e7c66;       /* surgical teal */
    --accent-ink: #ffffff;
    --get: #0b6e99;
    --post: #0e7c66;
    --put: #b45309;
    --delete: #b3261e;
    --ok: #0e7c66;
    --warn: #b45309;
    --err: #b3261e;
    --code-bg: #f0f4f2;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    /* JSON highlight */
    --j-key: #0b5e50;
    --j-str: #7a3e9d;
    --j-num: #0b6e99;
    --j-lit: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101614;
      --panel: #17201d;
      --ink: #e4ebe8;
      --muted: #8fa09a;
      --line: #26332e;
      --line-soft: #1d2825;
      --accent: #35a98f;
      --accent-ink: #0c1512;
      --get: #5aa9cc;
      --post: #43b598;
      --put: #d9913f;
      --delete: #d96a63;
      --ok: #43b598;
      --warn: #d9913f;
      --err: #d96a63;
      --code-bg: #131b18;
      --j-key: #6cc6b0;
      --j-str: #c49ae0;
      --j-num: #5aa9cc;
      --j-lit: #d9913f;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 var(--sans);
    background: var(--bg);
    color: var(--ink);
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  code, .mono { font-family: var(--mono); font-size: 13px; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

  /* ---- frame -------------------------------------------------------- */
  .frame {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .wordmark .dot { color: var(--accent); }
  .baseurl {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tokenbox {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .tokenbox label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tokenbtn {
    padding: 5px 10px;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tokenbox input {
    width: min(260px, 30vw);
    padding: 5px 9px;
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  .main {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 0;
  }

  /* ---- sidebar ------------------------------------------------------ */
  nav {
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding-bottom: 24px;
  }
  .filter {
    position: sticky;
    top: 0;
    padding: 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line-soft);
  }
  .filter input {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    font-size: 13px;
  }
  .tag {
    margin: 16px 12px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .op {
    display: flex;
    align-items: center;
    gap: 8px;
    width: calc(100% - 16px);
    margin: 1px 8px;
    padding: 6px 8px;
    border: 0;
    border-left: 3px solid transparent;
    border-radius: 6px;
    background: none;
    cursor: pointer;
    text-align: left;
  }
  .op:hover { background: var(--line-soft); }
  .op.active { background: var(--line-soft); border-left-color: var(--m, var(--accent)); }
  .op .path {
    font-family: var(--mono);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .op .lock-mini {
    flex: none;
    margin-left: auto;
    font-size: 10px;
    opacity: .7;
  }
  .badge {
    flex: 0 0 44px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    text-align: center;
    padding: 2px 0;
    border-radius: 4px;
    color: #fff;
    background: var(--m, var(--muted));
  }
  @media (prefers-color-scheme: dark) { .badge { color: var(--accent-ink); } }

  /* ---- workbench ---------------------------------------------------- */
  .work {
    overflow-y: auto;
    padding: 24px 28px 64px;
  }
  .empty {
    max-width: 460px;
    margin: 18vh auto;
    text-align: center;
    color: var(--muted);
  }
  .empty .mark { font-size: 40px; color: var(--accent); font-family: var(--mono); }

  .op-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .op-head .badge { flex: none; font-size: 12px; padding: 3px 10px; }
  .op-head h1 {
    margin: 0;
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 600;
    word-break: break-all;
  }
  .lock { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .summary { margin: 10px 0 2px; font-weight: 600; }
  .desc { margin: 2px 0 0; color: var(--muted); max-width: 74ch; }

  .cols {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 24px;
    margin-top: 20px;
    align-items: start;
  }
  @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } .main { grid-template-columns: 240px 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 4px;
  }
  .field label .req { color: var(--err); }
  .field input, .field textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .field textarea { resize: vertical; line-height: 1.55; tab-size: 2; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--panel);
    cursor: pointer;
  }
  .btn:hover { background: var(--line-soft); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .kbd-hint { font-size: 12px; color: var(--muted); }

  .json-err { color: var(--err); font-size: 12.5px; margin-top: 6px; }

  /* responses documented in the spec */
  .resp-doc { border-top: 1px solid var(--line-soft); margin-top: 14px; padding-top: 10px; }
  .resp-doc div { display: flex; gap: 10px; font-size: 12.5px; margin: 3px 0; }
  .resp-doc code { flex: 0 0 34px; text-align: center; }
  .resp-doc span { color: var(--muted); }

  /* ---- response vitals ---------------------------------------------- */
  .vitals {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-left: 4px solid var(--v, var(--muted));
    border-radius: 10px;
    background: var(--panel);
    font-family: var(--mono);
    margin-bottom: 12px;
  }
  .vitals .code { font-size: 22px; font-weight: 700; color: var(--v, var(--ink)); }
  .vitals .lbl { font-size: 12px; color: var(--muted); }
  .vitals .num { font-size: 14px; }

  pre.payload {
    margin: 0;
    padding: 14px;
    background: var(--code-bg);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    overflow-x: auto;
    max-height: 480px;
  }
  .j-k { color: var(--j-key); }
  .j-s { color: var(--j-str); }
  .j-n { color: var(--j-num); }
  .j-l { color: var(--j-lit); font-weight: 600; }

  details.hdrs { margin-top: 10px; }
  details.hdrs summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  details.hdrs table { margin-top: 8px; border-collapse: collapse; width: 100%; }
  details.hdrs td {
    font-family: var(--mono);
    font-size: 12px;
    padding: 3px 10px 3px 0;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: top;
    word-break: break-all;
  }
  details.hdrs td:first-child { color: var(--muted); white-space: nowrap; }

  .waiting { color: var(--muted); font-size: 13px; }

  /* field glossary under the JSON body */
  details.guide { margin-top: 8px; }
  details.guide summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  details.guide dl {
    margin: 10px 0 0;
    padding: 12px 14px;
    background: var(--code-bg);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
  }
  details.guide dt { margin-top: 8px; }
  details.guide dt:first-child { margin-top: 0; }
  details.guide dd {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    max-width: 62ch;
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="wordmark">iMed<span class="dot">·</span>mock console</div>
    <div class="baseurl mono" id="baseurl"></div>
    <div class="tokenbox">
      <label for="token">Bearer token</label>
      <input id="token" type="text" placeholder="click Get token" spellcheck="false"
             autocomplete="off">
      <button id="get-token" type="button" class="tokenbtn"
              title="POST /auth/token with client credentials (tokens expire — click again)">Get token</button>
    </div>
  </header>

  <div class="main">
    <nav id="nav">
      <div class="filter">
        <input id="filter" type="search" placeholder="Filter endpoints" aria-label="Filter endpoints">
      </div>
      <div id="oplist"><div class="waiting" style="padding:16px">Loading /v3/api-docs…</div></div>
    </nav>

    <div class="work" id="work">
      <div class="empty">
        <div class="mark">⌁</div>
        <p>Pick an endpoint from the list to build a request.<br>
        Requests run against this server, so what you send here hits the seeded data.</p>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

const METHOD_COLOR = { get: 'var(--get)', post: 'var(--post)', put: 'var(--put)', delete: 'var(--delete)' };

/* Plain-language meanings for the hospital's field names. Shown next to path
   params and in the "What the fields mean" list under the JSON body. */
const GLOSSARY = {
  tn: 'transaction number — the hospital’s ID for one visit; grab one from GET /api/cases',
  visit_id: 'the visit’s transaction number (TN) — same value the read endpoints call "tn"',
  object_id: 'iMed’s ID for a row. Top-level = the visit’s TN; inside a list it is the row’s own ID — leave empty on POST (iMed generates it), required on PUT',
  diagnosis_icd10_id: 'the object_id that POST returned for this ICD-10 row',
  diagnosis_icd9_id: 'the object_id that POST returned for this ICD-9 row',
  request_id: 'your unique ID for this request — sending the same one again replays the stored answer instead of writing twice',
  fix_visit_type_id: 'OPD (walk-in, went home same day) or IPD (admitted to a ward)',
  fix_diagnosis_type_id: 'the code’s role: PRIMARY_DIAGNOSIS (the main one, only one allowed), COMORBIDITY (came in with it), OTHERS, or EXTERNAL_CAUSE_OF_INJURY',
  fix_operation_type_id: 'procedure type from hospital master data — any non-blank value works in the mock',
  doctor_discharge: 'must be "1" — means the doctor has finished and discharged the patient',
  icd10_code: 'ICD-10 diagnosis code, e.g. E11.9 (what the patient HAS)',
  icd9_code: 'ICD-9 procedure code, e.g. 39.95 (what was DONE to the patient)',
  icd10_description: 'the code’s official text, e.g. "Type 2 diabetes mellitus without complications"',
  icd9_description: 'the procedure code’s official text',
  beginning_diagnosis: 'the diagnosis written as free text (doctor’s wording)',
  beginning_operation: 'the procedure written as free text (doctor’s wording)',
  is_personal_illness: '"1" = a chronic disease the patient carries (then patient_id is required)',
  patient_id: 'the hospital’s permanent patient ID (HN) — stays the same across visits',
  doctor_eid: 'the doctor’s employee ID',
  discharge_doctor_eid: 'employee ID of the doctor who discharged the patient',
  base_clinic_id: 'which clinic/department the diagnosis was made in',
  diagnosis_date: 'date the diagnosis was made (YYYY-MM-DD)',
  diagnosis_time: 'time the diagnosis was made (HH:mm:ss)',
  date_in: 'date the procedure started (YYYY-MM-DD)',
  time_in: 'time the procedure started (HH:mm:ss)',
  date_out: 'date the procedure ended',
  time_out: 'time the procedure ended',
  fix_opd_discharge_status_id: 'how the OPD visit ended (hospital master data)',
  fix_ipd_discharge_status_id: 'the patient’s condition at discharge (hospital master data)',
  fix_ipd_discharge_type_id: 'how the admission ended, e.g. sent home / transferred (master data)',
  base_doctor_discharge_type_id: 'discharge type from hospital master data',
  finalized_at: 'when the coder approved the case (timestamp text)',
  updated_by: 'who made the change (coder’s email)',
  reason_admission: 'why the patient was admitted (discharge summary section)',
  physical_examination: 'exam findings (discharge summary section)',
  diagnostic: 'diagnosis summary (discharge summary section)',
  investigation: 'labs/imaging done (discharge summary section)',
  hospital_course: 'what happened during the stay (discharge summary section)',
  treatment: 'treatment given (discharge summary section)',
  plan_or_advice: 'plan or advice given at discharge',
  discharge_instruction: 'instructions the patient went home with',
  is_follow_up: '"1" = a follow-up appointment is planned',
  is_from: 'where the record was entered from (source system marker)',
  note: 'free-text note',
  comments: 'free-text note',
};
const state = { spec: null, ops: [], current: null };

/* ---- demo samples ------------------------------------------------------
   One-click bodies for the four /api/v1 write calls. The POST/PUT responses
   carry the generated object_ids; send() captures them into demoCtx so the
   PUT/DELETE samples fill themselves with the right ids — no copy-pasting
   between calls during a demo. Persisted so a page reload keeps the ids. */
const DEMO_TN = '87026072209142300201';
const demoCtx = JSON.parse(localStorage.getItem('imed-console-demo') || '{}');
function saveDemoCtx() { localStorage.setItem('imed-console-demo', JSON.stringify(demoCtx)); }
const NEED_POST = '(run the POST sample first)';
function today() { return new Date().toISOString().slice(0, 10); }

const SAMPLES = {
  'post /api/v1/diagnosis': () => ({
    body: {
      request_id: uuid(),
      object_id: demoCtx.tn || DEMO_TN,
      fix_visit_type_id: 'OPD',
      doctor_discharge: '1',
      diagnosis_icd10: [{
        icd10_code: 'E11.9',
        icd10_description: 'Type 2 diabetes mellitus without complications',
        fix_diagnosis_type_id: 'PRIMARY_DIAGNOSIS',
        diagnosis_date: today(),
        diagnosis_time: '14:30:00',
      }],
      diagnosis_icd9: [{
        icd9_code: '39.95',
        icd9_description: 'Hemodialysis',
        fix_operation_type_id: 'OR Procedure',
        date_in: today(), time_in: '14:00:00',
        date_out: today(), time_out: '15:00:00',
      }],
      doctor_discharge_opd: { fix_opd_discharge_status_id: 'COMPLETE' },
    },
  }),
  'put /api/v1/diagnosis/{visit_id}': () => ({
    params: { visit_id: demoCtx.tn || DEMO_TN },
    body: {
      request_id: uuid(),
      object_id: demoCtx.tn || DEMO_TN,
      fix_visit_type_id: 'OPD',
      doctor_discharge: '1',
      diagnosis_icd10: [{
        object_id: demoCtx.icd10_id || NEED_POST,
        icd10_code: 'E11.65',
        icd10_description: 'Type 2 diabetes mellitus with hyperglycaemia',
        fix_diagnosis_type_id: 'PRIMARY_DIAGNOSIS',
        diagnosis_date: today(),
        diagnosis_time: '14:30:00',
      }],
    },
  }),
  'delete /api/v1/diagnosis/{visit_id}/icd10/{diagnosis_icd10_id}': () => ({
    params: {
      visit_id: demoCtx.tn || DEMO_TN,
      diagnosis_icd10_id: demoCtx.icd10_id || NEED_POST,
    },
  }),
  'delete /api/v1/diagnosis/{visit_id}/icd9/{diagnosis_icd9_id}': () => ({
    params: {
      visit_id: demoCtx.tn || DEMO_TN,
      diagnosis_icd9_id: demoCtx.icd9_id || NEED_POST,
    },
  }),
};

function applySample(o) {
  const make = SAMPLES[o.id];
  if (!make) return;
  const s = make();
  for (const input of document.querySelectorAll('#params input[data-param]')) {
    if (s.params && s.params[input.dataset.param] !== undefined) {
      input.value = s.params[input.dataset.param];
    }
  }
  const ta = document.getElementById('body');
  if (ta && s.body !== undefined) {
    ta.value = JSON.stringify(s.body, null, 2);
    const e = document.getElementById('bodyerr');
    if (e) e.hidden = true;
  }
}

/* ---- token persistence ------------------------------------------------ */
const tokenInput = document.getElementById('token');
tokenInput.value = localStorage.getItem('imed-console-token') || '';
tokenInput.addEventListener('input', () => localStorage.setItem('imed-console-token', tokenInput.value));

/* Trade client credentials for a token, the way the hospital's guide does it:
   POST /auth/token, Basic client_id:client_secret, grant_type=client_credentials.
   The defaults are the mock's own (IMED_CLIENT_ID / IMED_CLIENT_SECRET unset). */
document.getElementById('get-token').addEventListener('click', async () => {
  const id = prompt('client_id', 'medcode-mock-client');
  if (id === null) return;
  const secret = prompt('client_secret', 'medcode-mock-secret');
  if (secret === null) return;
  try {
    const res = await fetch('/auth/token', {
      method: 'POST',
      headers: {
        'Authorization': 'Basic ' + btoa(id + ':' + secret),
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: 'grant_type=client_credentials',
    });
    const body = await res.json();
    if (!res.ok) throw new Error(res.status + ' ' + (body.message || ''));
    tokenInput.value = body.access_token;
    localStorage.setItem('imed-console-token', body.access_token);
    tokenInput.title = 'expires in ' + body.expires_in + 's';
  } catch (e) {
    alert('Token request failed: ' + e.message);
  }
});

document.getElementById('baseurl').textContent = location.origin;

/* ---- load the live spec ----------------------------------------------- */
fetch('/v3/api-docs')
  .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
  .then(spec => {
    state.spec = spec;
    buildOps(spec);
    // deep link: #<method> <path> (encoded) selects that endpoint on load
    const target = decodeURIComponent(location.hash.slice(1));
    const hit = state.ops.find(o => o.id === target);
    if (hit) { state.current = hit; renderOp(hit); }
    renderNav();
  })
  .catch(e => {
    document.getElementById('oplist').innerHTML =
      '<div class="waiting" style="padding:16px">Could not load /v3/api-docs — ' + esc(e.message) + '</div>';
  });

function buildOps(spec) {
  const ops = [];
  for (const [path, methods] of Object.entries(spec.paths || {})) {
    for (const [method, op] of Object.entries(methods)) {
      if (!['get', 'post', 'put', 'delete', 'patch'].includes(method)) continue;
      ops.push({
        id: method + ' ' + path,
        method, path, op,
        tag: (op.tags && op.tags[0]) || 'Other',
        secured: Array.isArray(op.security) && op.security.length > 0,
      });
    }
  }
  // group by tag, keep the spec's own tag ordering (springdoc sorts alpha)
  const tagOrder = [...new Set(ops.map(o => o.tag))];
  ops.sort((a, b) => tagOrder.indexOf(a.tag) - tagOrder.indexOf(b.tag) || a.path.localeCompare(b.path));
  state.ops = ops;
}

/* ---- sidebar ----------------------------------------------------------- */
function renderNav() {
  const list = document.getElementById('oplist');
  const q = document.getElementById('filter').value.trim().toLowerCase();
  list.innerHTML = '';
  let lastTag = null;
  for (const o of state.ops) {
    if (q && !(o.path + ' ' + o.method + ' ' + (o.op.summary || '')).toLowerCase().includes(q)) continue;
    if (o.tag !== lastTag) {
      lastTag = o.tag;
      const t = document.createElement('div');
      t.className = 'tag';
      t.textContent = o.tag;
      list.appendChild(t);
    }
    const b = document.createElement('button');
    b.className = 'op' + (state.current && state.current.id === o.id ? ' active' : '');
    b.style.setProperty('--m', METHOD_COLOR[o.method] || 'var(--muted)');
    b.innerHTML = '<span class="badge">' + o.method.toUpperCase() + '</span>' +
                  '<span class="path">' + esc(o.path) + '</span>' +
                  (o.secured ? '<span class="lock-mini" title="Bearer token required">🔒</span>' : '');
    b.title = o.op.summary || o.path;
    b.addEventListener('click', () => {
      state.current = o;
      history.replaceState(null, '', '#' + encodeURIComponent(o.id));
      renderNav();
      renderOp(o);
    });
    list.appendChild(b);
  }
  if (!list.children.length) {
    list.innerHTML = '<div class="waiting" style="padding:16px">No endpoint matches.</div>';
  }
}
document.getElementById('filter').addEventListener('input', renderNav);

/* ---- workbench ---------------------------------------------------------- */
function renderOp(o) {
  const work = document.getElementById('work');
  const params = (o.op.parameters || []).filter(p => p.in === 'path' || p.in === 'query');
  const bodyExample = requestBodyExample(o.op);
  const respDocs = Object.entries(o.op.responses || {});

  work.innerHTML = `
    <div class="op-head" style="--m:${METHOD_COLOR[o.method]}">
      <span class="badge" style="--m:${METHOD_COLOR[o.method]}">${o.method.toUpperCase()}</span>
      <h1>${esc(o.path)}</h1>
      ${o.secured ? '<span class="lock">🔒 Bearer token required</span>' : ''}
    </div>
    ${o.op.summary ? '<p class="summary">' + esc(o.op.summary) + '</p>' : ''}
    ${o.op.description ? '<p class="desc">' + ticks(o.op.description) + '</p>' : ''}

    <div class="cols">
      <div class="card">
        <h2>Request</h2>
        <div id="params"></div>
        ${bodyExample !== null ? `
          <div class="field">
            <label for="body">JSON body</label>
            <textarea id="body" rows="16" spellcheck="false"></textarea>
            <div class="json-err" id="bodyerr" hidden></div>
            ${fieldGuide(bodyExample)}
          </div>` : ''}
        <div class="field">
          <label for="xhdrs">Extra headers <span class="hint" style="display:inline">(one per line, <code>Name: value</code>)</span></label>
          <textarea id="xhdrs" rows="2" spellcheck="false" placeholder="X-Debug: 1"></textarea>
        </div>
        <div class="row">
          <button class="btn primary" id="send">Send request</button>
          ${SAMPLES[o.id] ? '<button class="btn" id="sample">Use sample</button>' : ''}
          ${bodyExample !== null ? '<button class="btn" id="reset">Reset body</button>' : ''}
          <button class="btn" id="curl">Copy as curl</button>
          <span class="kbd-hint">⌘⏎ sends</span>
        </div>
        ${respDocs.length ? `
          <div class="resp-doc">
            ${respDocs.map(([c, r]) =>
              '<div><code>' + esc(c) + '</code><span>' + esc(r.description || '') + '</span></div>').join('')}
          </div>` : ''}
      </div>

      <div class="card">
        <h2>Response</h2>
        <div id="respbox"><p class="waiting">Nothing sent yet.</p></div>
      </div>
    </div>`;

  // param inputs
  const pbox = work.querySelector('#params');
  for (const p of params) {
    const f = document.createElement('div');
    f.className = 'field';
    const meaning = p.description || GLOSSARY[p.name];
    f.innerHTML = '<label>' + esc(p.name) +
      (p.required ? ' <span class="req">*</span>' : '') +
      ' <span class="hint" style="display:inline">' + p.in + '</span></label>' +
      '<input type="text" spellcheck="false" autocomplete="off" data-param="' + esc(p.name) + '" data-in="' + p.in + '">' +
      (meaning ? '<div class="hint">(' + esc(meaning) + ')</div>' : '');
    pbox.appendChild(f);
  }

  const bodyTa = work.querySelector('#body');
  if (bodyTa) bodyTa.value = JSON.stringify(bodyExample, null, 2);

  work.querySelector('#send').addEventListener('click', () => send(o));
  const sampleBtn = work.querySelector('#sample');
  if (sampleBtn) sampleBtn.addEventListener('click', () => applySample(o));
  const resetBtn = work.querySelector('#reset');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    bodyTa.value = JSON.stringify(requestBodyExample(o.op), null, 2);
    work.querySelector('#bodyerr').hidden = true;
  });
  work.querySelector('#curl').addEventListener('click', ev => copyCurl(o, ev.target));
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && state.current) send(state.current);
});

/* ---- building & sending the request ------------------------------------ */
function buildRequest(o) {
  let path = o.path;
  const query = new URLSearchParams();
  for (const input of document.querySelectorAll('#params input[data-param]')) {
    const v = input.value;
    if (input.dataset.in === 'path') {
      path = path.replace('{' + input.dataset.param + '}', encodeURIComponent(v));
    } else if (v !== '') {
      query.set(input.dataset.param, v);
    }
  }
  const url = path + (query.toString() ? '?' + query : '');

  const headers = {};
  const token = tokenInput.value.trim();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const xh = document.getElementById('xhdrs');
  if (xh) for (const line of xh.value.split('\n')) {
    const i = line.indexOf(':');
    if (i > 0) headers[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }

  let body;
  const ta = document.getElementById('body');
  const errBox = document.getElementById('bodyerr');
  if (ta) {
    try {
      JSON.parse(ta.value);          // validate, but send the text verbatim
      errBox.hidden = true;
    } catch (e) {
      errBox.textContent = 'Body is not valid JSON — ' + e.message;
      errBox.hidden = false;
      return null;
    }
    body = ta.value;
    headers['Content-Type'] = 'application/json';
  }
  return { url, headers, body };
}

async function send(o) {
  const req = buildRequest(o);
  if (!req) return;
  const box = document.getElementById('respbox');
  box.innerHTML = '<p class="waiting">Sending…</p>';
  const t0 = performance.now();
  let res, text;
  try {
    res = await fetch(req.url, { method: o.method.toUpperCase(), headers: req.headers, body: req.body });
    text = await res.text();
  } catch (e) {
    box.innerHTML = '<p class="json-err">Request failed — ' + esc(e.message) + '</p>';
    return;
  }
  const ms = Math.round(performance.now() - t0);

  // demo helper: remember the ids the diagnosis API generates so the
  // PUT/DELETE "Use sample" buttons can fill themselves in
  if (res.ok && (o.method === 'post' || o.method === 'put') && o.path.startsWith('/api/v1/diagnosis')) {
    try {
      const r = JSON.parse(text).result;
      if (r) {
        if (r.object_id) demoCtx.tn = r.object_id;
        const d10 = Array.isArray(r.diagnosis_icd10) && r.diagnosis_icd10[0];
        if (d10 && d10.object_id) demoCtx.icd10_id = d10.object_id;
        const d9 = Array.isArray(r.diagnosis_icd9) && r.diagnosis_icd9[0];
        if (d9 && d9.object_id) demoCtx.icd9_id = d9.object_id;
        saveDemoCtx();
      }
    } catch (e) { /* not JSON — nothing to capture */ }
  }

  const tone = res.status < 300 ? 'var(--ok)' : res.status < 500 ? 'var(--warn)' : 'var(--err)';
  let payload;
  try { payload = highlight(JSON.stringify(JSON.parse(text), null, 2)); }
  catch { payload = esc(text) || '<span class="waiting">(empty body)</span>'; }

  const hdrRows = [...res.headers.entries()]
    .map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>').join('');

  box.innerHTML = `
    <div class="vitals" style="--v:${tone}">
      <span class="code">${res.status}</span>
      <span class="lbl">${esc(res.statusText || httpName(res.status))}</span>
      <span class="num">${ms}<span class="lbl"> ms</span></span>
      <span class="num">${fmtBytes(text.length)}</span>
    </div>
    <pre class="payload">${payload}</pre>
    <details class="hdrs">
      <summary>Response headers (${res.headers ? [...res.headers.keys()].length : 0})</summary>
      <table>${hdrRows}</table>
    </details>`;
}

function copyCurl(o, btn) {
  const req = buildRequest(o);
  if (!req) return;
  const parts = ['curl -X ' + o.method.toUpperCase(), shq(location.origin + req.url)];
  for (const [k, v] of Object.entries(req.headers)) parts.push('-H ' + shq(k + ': ' + v));
  if (req.body !== undefined) parts.push('-d ' + shq(req.body));
  navigator.clipboard.writeText(parts.join(' \\\n  ')).then(() => {
    const t = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = t; }, 1200);
  });
}

/* ---- example generation from the OpenAPI schemas ------------------------ */
function requestBodyExample(op) {
  const content = op.requestBody && op.requestBody.content;
  const media = content && (content['application/json'] || Object.values(content)[0]);
  if (!media) return null;
  if (media.example !== undefined) return media.example;
  return exampleFromSchema(media.schema, new Set());
}

function exampleFromSchema(schema, seen) {
  schema = deref(schema);
  if (!schema) return {};
  if (schema.example !== undefined) return schema.example;
  if (schema.enum) return schema.enum[0];
  const type = schema.type || (schema.properties ? 'object' : 'string');
  switch (type) {
    case 'object': {
      const key = schema.$id || JSON.stringify(Object.keys(schema.properties || {}));
      if (seen.has(key)) return {};           // cycle guard
      seen.add(key);
      const out = {};
      for (const [name, prop] of Object.entries(schema.properties || {})) {
        out[name] = name === 'request_id' ? uuid() : exampleFromSchema(prop, seen);
      }
      seen.delete(key);
      return out;
    }
    case 'array':  return [exampleFromSchema(schema.items, seen)];
    case 'integer':
    case 'number': return 0;
    case 'boolean': return false;
    default: return '';
  }
}

function deref(schema) {
  let hops = 0;
  while (schema && schema.$ref && hops++ < 20) {
    const name = schema.$ref.split('/').pop();
    schema = state.spec.components && state.spec.components.schemas
      ? state.spec.components.schemas[name] : null;
  }
  return schema;
}

/* "What the fields mean" — glossary entries for the keys this body actually has */
function fieldGuide(example) {
  const keys = [];
  (function walk(v) {
    if (Array.isArray(v)) return v.forEach(walk);
    if (v && typeof v === 'object') {
      for (const [k, val] of Object.entries(v)) {
        if (GLOSSARY[k] && !keys.includes(k)) keys.push(k);
        walk(val);
      }
    }
  })(example);
  if (!keys.length) return '';
  return `<details class="guide">
    <summary>What the fields mean (${keys.length})</summary>
    <dl>${keys.map(k =>
      '<dt><code>' + esc(k) + '</code></dt><dd>' + esc(GLOSSARY[k]) + '</dd>').join('')}</dl>
  </details>`;
}

/* ---- small utilities ----------------------------------------------------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function ticks(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
function uuid() {
  return crypto.randomUUID ? crypto.randomUUID()
    : 'req-' + Math.random().toString(36).slice(2, 10);
}
function shq(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
function fmtBytes(n) { return n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB'; }
function httpName(code) {
  return { 200: 'OK', 400: 'Bad Request', 401: 'Unauthorized', 404: 'Not Found',
           409: 'Conflict', 429: 'Too Many Requests', 500: 'Server Error' }[code] || '';
}

/* JSON syntax highlight: tokenizes an already-pretty-printed string */
function highlight(json) {
  return esc(json).replace(
    /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
    (m, str, colon, lit) => {
      if (str) return colon ? '<span class="j-k">' + str + '</span>' + colon
                            : '<span class="j-s">' + str + '</span>';
      if (lit) return '<span class="j-l">' + lit + '</span>';
      return '<span class="j-n">' + m + '</span>';
    });
}
